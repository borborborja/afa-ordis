services:
  app:
    image: ${APP_IMAGE:-ghcr.io/borborborja/afa-ordis}:${APP_IMAGE_TAG:-latest}
    env_file: ${ENV_FILE:-.env}
    volumes:
      - app_data:/data
      - ${ENCRYPTION_KEY_HOST_FILE:?Set ENCRYPTION_KEY_HOST_FILE}:/run/secrets/afa_keys:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    ulimits:
      core: 0
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.afa-ordis.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.afa-ordis.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.afa-ordis.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.afa-ordis.loadbalancer.server.port=8000
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  app_data:

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
