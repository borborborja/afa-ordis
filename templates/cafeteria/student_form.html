{% extends 'cafeteria/base.html' %}
{% block content %}<section class="form-page card"><p class="eyebrow">{{ student.family.name }}</p><h1>Fitxa de {{ student.full_name }}</h1><p>La condició de beca només la pot modificar l’administració.</p><form method="post" class="stack-form">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</label>{% endfor %}<div class="button-row"><button class="button primary">Desar canvis</button><a class="button secondary" href="{% url 'cafeteria:family_calendar' student.family_id %}">Cancel·lar</a></div></form></section>{% endblock %}
