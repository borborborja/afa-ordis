name: Build container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and test image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the application image
        run: docker build --tag afa-ordis:${{ github.sha }} .

      - name: Validate Django configuration
        run: >-
          docker run --rm
          -e DATABASE_ENGINE=django.db.backends.sqlite3
          -e DATABASE_NAME=/tmp/check.sqlite3
          -e DJANGO_DEBUG=true
          --entrypoint python
          afa-ordis:${{ github.sha }} manage.py check

      - name: Run application tests
        run: >-
          docker run --rm
          -e DATABASE_ENGINE=django.db.backends.sqlite3
          -e DATABASE_NAME=/tmp/test.sqlite3
          -e DJANGO_DEBUG=true
          --entrypoint python
          afa-ordis:${{ github.sha }} manage.py test apps.cafeteria -v 1

      - name: Verify migrations are current
        run: >-
          docker run --rm
          -e DATABASE_ENGINE=django.db.backends.sqlite3
          -e DATABASE_NAME=/tmp/check.sqlite3
          --entrypoint python
          afa-ordis:${{ github.sha }} manage.py makemigrations --check --dry-run

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE="${IMAGE,,}"
          docker tag afa-ordis:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker tag afa-ordis:${{ github.sha }} "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
