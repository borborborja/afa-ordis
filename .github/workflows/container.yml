name: Build container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and test image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build the application image
        run: docker build --tag afa-ordis:${{ github.sha }} .

      - name: Block incomplete or mixed-language interface text
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            -e DJANGO_DEBUG=true \
            --entrypoint sh \
            afa-ordis:${{ github.sha }} \
            -c 'python manage.py makemessages -l es --no-location --no-obsolete'
          git diff --exit-code -- locale
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace:ro" \
            --workdir /workspace \
            -e DJANGO_DEBUG=true \
            --entrypoint sh \
            afa-ordis:${{ github.sha }} \
            -c 'python manage.py check_i18n'

      - name: Validate Django configuration
        run: >-
          docker run --rm
          -e DATABASE_ENGINE=django.db.backends.sqlite3
          -e DATABASE_NAME=/tmp/check.sqlite3
          -e DJANGO_DEBUG=true
          --entrypoint python
          afa-ordis:${{ github.sha }} manage.py check

      - name: Run application tests
        run: >-
          docker run --rm
          -e DATABASE_ENGINE=django.db.backends.sqlite3
          -e DATABASE_NAME=/tmp/test.sqlite3
          -e DATABASE_TEST_NAME=/tmp/test-suite.sqlite3
          -e DJANGO_DEBUG=true
          --entrypoint python
          afa-ordis:${{ github.sha }} manage.py test apps.cafeteria -v 1

      - name: Validate production security settings
        run: |
          docker run --rm --tmpfs /tmp \
            -e DJANGO_SECRET_KEY=ci-only-production-check-key-abcdefghijklmnopqrstuvwxyz-0123456789 \
            -e APP_BASE_URL=https://portal.example.test \
            -e DJANGO_ALLOWED_HOSTS=portal.example.test \
            -e ENCRYPTION_KEY_FILE=/tmp/keys.json \
            -e DATABASE_NAME=/tmp/production-check.sqlite3 \
            --entrypoint sh afa-ordis:${{ github.sha }} -c '
              DJANGO_DEBUG=true DATA_ENCRYPTION_ENABLED=false python manage.py generate_encryption_keys --output /tmp/keys.json &&
              DJANGO_DEBUG=false python manage.py check --deploy --fail-level WARNING'

      - name: Run encrypted database, media and recovery integration tests
        run: |
          docker run --rm --tmpfs /tmp \
            -e ENCRYPTION_KEY_FILE=/tmp/keys.json \
            -e DATABASE_NAME=/tmp/encrypted.sqlite3 \
            -e DATABASE_TEST_NAME=/tmp/encrypted-suite.sqlite3 \
            --entrypoint sh afa-ordis:${{ github.sha }} -c '
              DJANGO_DEBUG=true DATA_ENCRYPTION_ENABLED=false python manage.py generate_encryption_keys --output /tmp/keys.json &&
              DJANGO_DEBUG=true DATA_ENCRYPTION_ENABLED=true python manage.py test apps.cafeteria --noinput -v 1'

      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Check Python for undefined names and invalid code
        run: |
          python -m pip install ruff==0.16.6
          python -m ruff check apps config --select F

      - name: Verify migrations are current
        run: >-
          docker run --rm
          -e DATABASE_ENGINE=django.db.backends.sqlite3
          -e DATABASE_NAME=/tmp/check.sqlite3
          -e DJANGO_DEBUG=true
          --entrypoint python
          afa-ordis:${{ github.sha }} manage.py makemigrations --check --dry-run

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE="${IMAGE,,}"
          docker tag afa-ordis:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker tag afa-ordis:${{ github.sha }} "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
