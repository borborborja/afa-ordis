name: Build container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the application image
        run: docker build --tag afa-ordis:${{ github.sha }} .

      - name: Validate Django configuration
        run: >-
          docker run --rm
          -e DATABASE_ENGINE=django.db.backends.sqlite3
          -e DATABASE_NAME=/tmp/check.sqlite3
          -e DJANGO_DEBUG=true
          --entrypoint python
          afa-ordis:${{ github.sha }} manage.py check

      - name: Run application tests
        run: >-
          docker run --rm
          -e DATABASE_ENGINE=django.db.backends.sqlite3
          -e DATABASE_NAME=/tmp/test.sqlite3
          -e DJANGO_DEBUG=true
          --entrypoint python
          afa-ordis:${{ github.sha }} manage.py test apps.cafeteria -v 1

      - name: Verify migrations are current
        run: >-
          docker run --rm
          -e DATABASE_ENGINE=django.db.backends.sqlite3
          -e DATABASE_NAME=/tmp/check.sqlite3
          --entrypoint python
          afa-ordis:${{ github.sha }} manage.py makemigrations --check --dry-run
